# Every hour: check Anthropic's apt repo (and Debian's OVMF) for new versions.
# When something changed, open a pull request; the Build workflow tests it and
# GitHub auto-merge merges it when all checks pass.
name: Check for updates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run flatpak-external-data-checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          # A fine-grained token: PRs opened with the default GITHUB_TOKEN
          # would not start the Build workflow.
          GITHUB_TOKEN: ${{ secrets.CHECKER_TOKEN }}
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        with:
          args: --update --never-fork io.github.musmandev092.ClaudeDesktop.yaml

      - name: Enable auto-merge on the update PR
        env:
          GH_TOKEN: ${{ secrets.CHECKER_TOKEN }}
        run: |
          for pr in $(gh pr list --author "@me" --state open --json number,headRefName \
                        --jq '.[] | select(.headRefName | startswith("update-")) | .number'); do
            gh pr merge "$pr" --auto --squash || true
          done
