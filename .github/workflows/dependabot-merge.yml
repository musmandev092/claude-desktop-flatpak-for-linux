name: Merge tested Dependabot updates

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge passing Dependabot pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write          # merge into main
      pull-requests: write     # merge the PR
      checks: read             # read check results
    steps:
      - name: Merge the ones whose checks all passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | "\(.number) \(.head.sha) \(.base.ref)"' |
          while read -r pr sha base; do
            stale=$(gh api "repos/$REPO/compare/$sha...$base" \
                    --jq '[.files[]? | select(.filename | startswith(".github/workflows/"))] | length')
            if [ "$stale" -gt 0 ]; then
              echo "::warning::PR #$pr is out of date with the workflows on $base – comment '@dependabot rebase' on it"
              continue
            fi
            checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
                     --jq '[.check_runs[] | {name, status, conclusion}]')
            build_ok=$(jq -r '[.[] | select(.name == "Build and test" and .conclusion == "success")] | length' <<<"$checks")
            not_done=$(jq -r '[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length' <<<"$checks")
            if [ "$build_ok" -ge 1 ] && [ "$not_done" -eq 0 ]; then
              echo "PR #$pr: all checks passed on $sha – merging"
              gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$sha" ||
                echo "::warning::PR #$pr could not be merged; it is retried next hour"
            else
              echo "PR #$pr: not ready (build passed: $build_ok, pending/failed checks: $not_done)"
            fi
          done

