id: io.github.musmandev092.ClaudeDesktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: claude-desktop
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

finish-args:
  # Display: Wayland first, X11 only as fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # All devices: GPU, plus /dev/kvm and /dev/vhost-vsock for the Cowork VM
  # (there is no narrower permission for vhost-vsock)
  - --device=all
  # Internet and sound
  - --share=network
  - --socket=pulseaudio
  # Keyring (stores the login), notifications, tray icon
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Claude Code needs to open project folders
  - --filesystem=home
  # Plugin bridge: lets host-run start commands on the host / in a toolbox
  - --talk-name=org.freedesktop.Flatpak

modules:
  # host-spawn: runs host commands with a real terminal (pty), built from source
  - name: host-spawn
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        CGO_ENABLED: '0'
        GOFLAGS: -mod=vendor
    build-commands:
      - GOCACHE="$PWD/.gocache" go build -trimpath -ldflags "-s -w -X main.Version=1.6.2"
        -o ${FLATPAK_DEST}/bin/host-spawn .
    sources:
      - type: git
        url: https://github.com/1player/host-spawn.git
        tag: v1.6.2
        commit: d76c3a5196a8e0943f6a1c7c9f1acde4bd83c40c
      # Go dependencies, so the build needs no network
      - type: archive
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-vendor.tar.zst
        sha256: 9abfddf5c1eba0704d643de06988ff3b8cdd2f594bfb4d1c0027315552dad5cc
    cleanup:
      - /lib/debug

  # ── Cowork VM stack ────────────────────────────────────────────────────────
  # libcap-ng: needed by the virtiofsd that ships inside Claude's .deb
  - name: libcap-ng
    config-opts:
      - --disable-static
      - --without-python3
    sources:
      - type: archive
        url: https://people.redhat.com/sgrubb/libcap-ng/libcap-ng-0.8.5.tar.gz
        sha256: 3ba5294d1cbdfa98afaacfbc00b6af9ed2b83e8a21817185dfd844cc8c7ac6ff
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share

  # libslirp: user-mode networking for the VM (no root needed)
  - name: libslirp
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.5/libslirp-v4.9.5.tar.gz
        sha256: f43e68b60b580647574ec4a0e2b6c600a56281e6c39f79426510832dc810f483
    cleanup:
      - /include
      - /lib/pkgconfig

  # QEMU: only the x86_64 system emulator, only what Cowork uses
  # (KVM, q35, vhost-vsock, vhost-user-fs, virtio-net with slirp, memfd)
  - name: qemu
    buildsystem: simple
    build-commands:
      - >-
        ./configure --prefix=${FLATPAK_DEST}
        --target-list=x86_64-softmmu
        --enable-kvm --enable-slirp
        --enable-vhost-user --enable-vhost-kernel --enable-vhost-net
        --disable-download --disable-werror --disable-debug-info
        --disable-docs --disable-tools --disable-guest-agent --disable-user
        --disable-gtk --disable-sdl --disable-vnc --disable-spice
        --disable-opengl --disable-curses --disable-virglrenderer
        --disable-libusb --disable-usb-redir --disable-smartcard
        --disable-xen --audio-drv-list=
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: archive
        url: https://download.qemu.org/qemu-11.1.1.tar.xz
        sha256: 079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482
    cleanup:
      - /include
      - /share/applications
      - /share/icons
      - /libexec/qemu-bridge-helper

  # OVMF: the VM's UEFI firmware, from Debian's prebuilt package (BSD licence).
  # Installed at the same file names Claude expects, under /app/share/OVMF.
  - name: ovmf
    buildsystem: simple
    build-commands:
      - bsdtar -xOf ovmf.deb 'data.tar.*' | bsdtar -xf - ./usr/share/OVMF/OVMF_CODE_4M.fd
        ./usr/share/OVMF/OVMF_VARS_4M.fd
      - install -Dm644 -t ${FLATPAK_DEST}/share/OVMF usr/share/OVMF/OVMF_CODE_4M.fd
        usr/share/OVMF/OVMF_VARS_4M.fd
    sources:
      - type: file
        url: http://deb.debian.org/debian/pool/main/e/edk2/ovmf_2025.02-8+deb13u1_all.deb
        sha256: 78e0d54df11fc77406cb7a0bc9a39e5bca6d1cbe06556b91d9a73491c52decdf
        dest-filename: ovmf.deb
        x-checker-data:
          type: debian-repo
          package-name: ovmf
          root: http://deb.debian.org/debian
          dist: trixie
          component: main

  - name: claude-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 claude-desktop.sh ${FLATPAK_DEST}/bin/claude-desktop
      - install -Dm755 host-run ${FLATPAK_DEST}/bin/host-run
      - install -Dm755 host-bridge ${FLATPAK_DEST}/bin/host-bridge
      - install -Dm755 cowork-patch ${FLATPAK_DEST}/bin/cowork-patch
      - install -Dm755 cowork-helper-shim ${FLATPAK_DEST}/bin/cowork-helper-shim
      # Cowork uses the virtiofsd that ships inside Claude's .deb
      - install -d ${FLATPAK_DEST}/libexec
      - ln -s /app/extra/claude-desktop/resources/virtiofsd ${FLATPAK_DEST}/libexec/virtiofsd
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      # Claude's own icon, taken from the same official .deb at build time
      - bsdtar -xOf claude-icons.deb 'data.tar.*' | bsdtar -xf - './usr/share/icons/hicolor/*/apps/claude-desktop.png'
      - for f in usr/share/icons/hicolor/*/apps/claude-desktop.png; do install -Dm644
        "$f" "${FLATPAK_DEST}/${f#usr/}"; mv "${FLATPAK_DEST}/${f#usr/}" "$(dirname
        "${FLATPAK_DEST}/${f#usr/}")/${FLATPAK_ID}.png"; done
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # Anthropic's official .deb, downloaded on the USER's machine at install time
      - type: extra-data
        filename: claude-desktop.deb
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_2.31226.1_amd64.deb
        sha256: 5a9bebdfcb1df6ce38767b373f3a7fabf77156a2ddd8a3f5d04961da5bde305e
        size: 181377680
        only-arches:
          - x86_64
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
          is-main-source: true
      # The same .deb again, only to take Claude's icon from it when building
      - type: file
        dest-filename: claude-icons.deb
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_2.31226.1_amd64.deb
        sha256: 5a9bebdfcb1df6ce38767b373f3a7fabf77156a2ddd8a3f5d04961da5bde305e
        only-arches:
          - x86_64
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
      # Our own files
      - type: file
        path: scripts/apply_extra.sh
      - type: file
        path: scripts/claude-desktop.sh
      - type: file
        path: scripts/host-run
      - type: file
        path: scripts/host-bridge
      - type: file
        path: scripts/cowork-patch
      - type: file
        path: scripts/cowork-helper-shim
      - type: file
        path: io.github.musmandev092.ClaudeDesktop.desktop
      - type: file
        path: io.github.musmandev092.ClaudeDesktop.metainfo.xml
